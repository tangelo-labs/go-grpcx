version: "2"
run:
  modules-download-mode: readonly
  tests: true
output:
  path-prefix: ""
linters:
  enable:
    - dupl
    - errname
    - errorlint
    - gocritic
    - gocyclo
    - godot
    - misspell
    - nlreturn
    - noctx
    - prealloc
    - revive
    - sqlclosecheck
    - unconvert
    - wastedassign
    - whitespace
    - wsl
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
  new: false
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
